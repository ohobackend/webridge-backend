<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'이메일 인증 ' + (${success} ? '완료' : '실패')">이메일 인증 결과</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333333; background-color: #f8fafc; padding: 20px; }
        .email-container { max-width: 500px; margin: 40px auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        .header { padding: 40px 30px 20px; text-align: center; }
        .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .logo-text { font-size: 24px; font-weight: bold; color: #2d3748; }
        .main-title { font-size: 28px; font-weight: bold; margin-bottom: 8px; line-height: 1.3; }
        .success-title { color: #2f855a; }
        .error-title { color: #c53030; }
        .subtitle { font-size: 18px; color: #4a5568; margin-bottom: 32px; }
        .content-box { border-radius: 12px; padding: 32px; margin: 0 30px 32px; text-align: center; border: 1px solid #e2e8f0; }
        .success-box { background-color: #f0fff4; border-color: #9ae6b4; }
        .error-box { background-color: #fff5f5; border-color: #feb2b2; }
        .content-text { font-size: 16px; line-height: 1.6; margin-bottom: 8px; }
        .success-text { color: #2f855a; }
        .error-text { color: #c53030; }
        .email-info { font-size: 14px; color: #718096; margin-top: 16px; }
        .highlight-email { color: #667eea; font-weight: 600; }
        .footer { background-color: #f8fafc; padding: 24px 30px; text-align: center; border-top: 1px solid #e2e8f0; font-size: 14px; color: #718096; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🌉</div>
                <div class="logo-text">WEBridge</div>
            </div>
            <h1 class="main-title" th:classappend="${success} ? 'success-title' : 'error-title'" th:text="${success} ? '인증 완료!' : '인증 실패'">인증 결과</h1>
            <p class="subtitle" th:text="${message}">메시지</p>
        </div>
        <div class="content-box" th:classappend="${success} ? 'success-box' : 'error-box'">
            <th:block th:if="${success}">
                <p class="content-text success-text">이메일 인증이 성공적으로 완료되었습니다.</p>
                <p class="content-text">이제 회원가입 페이지로 돌아가서 나머지 정보를 입력해주세요.</p>
            </th:block>
            <th:block th:unless="${success}">
                <p class="content-text error-text">이메일 인증에 실패했습니다.</p>
                <p class="content-text">회원가입 페이지로 돌아가서 다시 시도해주세요.</p>
            </th:block>
            <div class="email-info" th:if="${email != null}">
                <strong>이메일:</strong> <span class="highlight-email" th:text="${email}"></span>
            </div>
        </div>
        <div class="footer">
            <p>문의사항이 있으시면 언제든 연락주세요.</p>
            <p class="company-name">InAble 팀 드림</p>
        </div>
    </div>
    <script>
        setTimeout(() => {
            window.close();
        }, 100);
    </script>
</body>
</html>
