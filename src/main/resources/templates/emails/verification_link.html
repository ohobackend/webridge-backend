<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBridge 회원가입 인증</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333333; background-color: #f8fafc; padding: 20px; }
        .email-container { max-width: 500px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        .header { padding: 40px 30px 20px; text-align: center; }
        .logo { display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .logo-text { font-size: 24px; font-weight: bold; color: #2d3748; }
        .main-title { font-size: 28px; font-weight: bold; color: #2d3748; margin-bottom: 8px; line-height: 1.3; }
        .subtitle { font-size: 18px; color: #4a5568; margin-bottom: 32px; }
        .content-box { background-color: #f7fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; margin: 0 30px 32px; text-align: center; }
        .content-text { font-size: 16px; color: #4a5568; line-height: 1.6; margin-bottom: 8px; }
        .highlight-text { color: #667eea; font-weight: 600; }
        .expiry-text { font-size: 14px; color: #718096; margin-top: 16px; }
        .expiry-time { color: #e53e3e; font-weight: 600; }
        .button-container { text-align: center; padding: 0 30px 40px; }
        .verification-button { display: inline-block !important; background: #667eea !important; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; color: #ffffff !important; text-decoration: none !important; padding: 16px 40px !important; border-radius: 8px !important; font-weight: 600 !important; font-size: 16px !important; text-align: center !important; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4) !important; border: none !important; cursor: pointer !important; -webkit-text-size-adjust: none; }
        .footer { background-color: #f8fafc; padding: 24px 30px; text-align: center; border-top: 1px solid #e2e8f0; font-size: 14px; color: #718096; }
        .footer p { margin-bottom: 4px; }
        .company-name { font-weight: 600; color: #667eea; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🌉</div>
                <div class="logo-text">WEBridge</div>
            </div>
            <h1 class="main-title">WEBridge<br>회원가입을 환영합니다.</h1>
            <p class="subtitle">이메일 인증을 완료해주세요.</p>
        </div>
        <div class="content-box">
            <p class="content-text">회원가입을 위한 인증 메일입니다.</p>
            <p class="content-text"><span class="highlight-text">"인증하기"</span> 버튼을 누르시면 회원가입이 완료됩니다.</p>
            <p class="content-text">인증링크는 <span class="highlight-text">30분 후에</span> 만료됩니다.</p>
            <div class="expiry-text">
                이 링크는 <span class="expiry-time" th:text="${expiry_time}"></span>까지 유효합니다.
            </div>
        </div>
        <div class="button-container">
            <a th:href="${verification_url}" class="verification-button">인증하기</a>
        </div>
        <div class="footer">
            <p>이 이메일은 <span th:text="${user_email}"></span>(으)로 발송되었습니다.</p>
            <p>문의사항이 있으시면 언제든 연락주세요.</p>
            <p class="company-name"><span th:text="${company_name}">InAble</span> 팀 드림</p>
        </div>
    </div>
</body>
</html>
