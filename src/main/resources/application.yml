spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: webridge-backend

  datasource:
    url: ${DATABASE_URL_JDBC:jdbc:postgresql://localhost:5432/webridge}
    username: ${DB_USERNAME:webridge}
    password: ${DB_PASSWORD:webridge}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_HOST_USER:}
    password: ${EMAIL_HOST_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api/schema
  swagger-ui:
    path: /api/docs

webridge:
  jwt:
    secret: ${SECRET_KEY:django-insecure-=u+s8tq&lcjxdfy_bcdz*1&0nr-ibh!hijfrl%=&65y+d_bvuv}
    access-token-hours: ${JWT_ACCESS_TOKEN_LIFETIME:6}
    refresh-token-days: ${JWT_REFRESH_TOKEN_LIFETIME:30}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-url: ${BACKEND_URL:http://127.0.0.1:8080}
  openai-api-key: ${OPENAI_API_KEY:}
  reports-dir: ./reports
  scan:
    executor-pool-size: 1
    task-timeout-seconds: 900
  social:
    google:
      client-id: "${GOOGLE_CLIENT_ID:}"
      client-secret: "${GOOGLE_CLIENT_SECRET:}"
    kakao:
      client-id: "${KAKAO_CLIENT_ID:}"
      client-secret: "${KAKAO_CLIENT_SECRET:}"
    github:
      client-id: "${GITHUB_CLIENT_ID:}"
      client-secret: "${GITHUB_CLIENT_SECRET:}"
