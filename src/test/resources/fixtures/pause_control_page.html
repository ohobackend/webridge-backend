<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>정지 기능 및 캡처 테스트 페이지</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background: #ffffff;
            color: #111111;
        }
        .text-banner {
            width: 500px;
            height: 80px;
            background: #1e293b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 24px;
            border-radius: 8px;
        }
        .flicking-wrapper {
            width: 600px;
            border: 1px solid #cbd5e1;
            padding: 12px;
        }
        .flicking-viewport {
            width: 560px;
            height: 140px;
            overflow: hidden;
            position: relative;
            background: #f1f5f9;
        }
        .flicking-camera {
            display: flex;
            width: 1680px;
            height: 140px;
            transition: transform 0.2s linear;
        }
        .flicking-panel {
            width: 560px;
            height: 140px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: #e2e8f0;
        }
        .flicking-pagination {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }
        .flicking-pagination-bullet {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #94a3b8;
        }
        .flicking-pagination-bullet-active {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>정지 기능 테스트</h1>

    <!-- 1. 이미지 없는 텍스트 전용 자동 갱신 배너 -->
    <div id="promo-banner" class="text-banner">공지사항 1: 웹 접근성 자동 갱신 배너</div>

    <!-- 2. Flicking 스타일 캐러셀 + 형제 pagination bullet -->
    <div class="carousel-section">
        <div class="flicking-viewport">
            <div class="flicking-camera" id="camera">
                <div class="flicking-panel">슬라이드 1 콘텐츠</div>
                <div class="flicking-panel">슬라이드 2 콘텐츠</div>
                <div class="flicking-panel">슬라이드 3 콘텐츠</div>
            </div>
        </div>
        <div class="flicking-pagination">
            <span class="flicking-pagination-bullet flicking-pagination-bullet-active"></span>
            <span class="flicking-pagination-bullet"></span>
            <span class="flicking-pagination-bullet"></span>
        </div>
    </div>

    <script>
        const messages = [
            "공지사항 1: 웹 접근성 자동 갱신 배너",
            "공지사항 2: 텍스트만 있는 롤링 배너",
            "공지사항 3: 캡처 이미지 확인용 배너"
        ];
        let idx = 0;
        setInterval(() => {
            idx = (idx + 1) % 3;
            const banner = document.getElementById("promo-banner");
            banner.textContent = messages[idx];
            banner.setAttribute("data-slide", String(idx));

            const camera = document.getElementById("camera");
            camera.style.transform = `translateX(-${idx * 560}px)`;

            const bullets = document.querySelectorAll(".flicking-pagination-bullet");
            bullets.forEach((b, i) => {
                b.classList.toggle("flicking-pagination-bullet-active", i === idx);
            });
        }, 400);
    </script>
</body>
</html>
