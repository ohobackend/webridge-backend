services:
  postgres:
    image: postgres:16
    container_name: webridge-postgres
    environment:
      POSTGRES_DB: webridge
      POSTGRES_USER: webridge
      POSTGRES_PASSWORD: webridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: webridge-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
